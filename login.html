<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

     
   
         <form id="handleForm" class="login-container">
        <div>
            <label >Username*</label><br>
           <input type="text" placeholder="Ex: Panda143" id="userName" class="inputcontainer"/> 
        </div>
        <div>
            <label>Password*</label><br>
           <input type="password" placeholder="Ex: *******" id="password" class="inputcontainer"/> 
        </div>
         <div>
            <label>Email*</label><br>
           <input type="email" placeholder="Ex: Panda@143gmail.com" id="email" class="inputcontainer"/> 
        </div>
        <div>
            <label >Phone*</label><br>
            <input type="tel" placeholder="+91 xxx xxx xxx x" id="phone" class="inputcontainer"/>

        </div>
        <button class="login-btn">Login</button>
    </form>


    

    <Script src = "script.js" defer></Script>
</body>
</html>
